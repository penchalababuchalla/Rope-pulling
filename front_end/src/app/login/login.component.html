<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo" aria-hidden="true">🎮</div>
      <h1 class="login-title">Tug of War: Mathematics</h1>
      <p class="login-subtitle">Enter your name to start playing</p>
    </div>

    <form class="login-form" (ngSubmit)="onSubmit()">
      <label class="login-label" for="username">Your name</label>
      <input
        id="username"
        type="text"
        class="login-input"
        [(ngModel)]="username"
        name="username"
        placeholder="e.g. Alex"
        maxlength="32"
        autocomplete="username"
        autofocus
      />
      @if (error) {
        <p class="login-error" role="alert">{{ error }}</p>
      }
      <button type="submit" class="login-btn">
        <span class="login-btn-text">Play</span>
        <span class="login-btn-icon" aria-hidden="true">→</span>
      </button>
    </form>

    <p class="login-hint">No password needed. Just pick a name and play!</p>
  </div>
</div>
